<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌸 JLPT N3 Grammar Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink:    #FF8FAB;
      --pink-lt: #FFD6E3;
      --pink-bg: #FFF0F5;
      --lav:     #C09FFF;
      --lav-lt:  #EDE4FF;
      --lav-md:  #D4C4FF;
      --mint:    #6EE7C0;
      --mint-lt: #D4F7ED;
      --peach:   #FFBF96;
      --yellow:  #FFE066;
      --yel-lt:  #FFF8D6;
      --sky:     #91D8FF;
      --text:    #3D2444;
      --text-sm: #8A6099;
      --shadow:  rgba(180,120,220,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
      background: #FEF0FF;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Floating sakura petals ── */
    #petals { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
    .petal {
      position: absolute; top: -40px;
      font-size: 1.4rem; opacity: 0.55;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(-40px) rotate(0deg); opacity: 0.6; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #FF7FB0 0%, #B07FFF 55%, #7FC8FF 100%);
      color: white; text-align: center; padding: 48px 24px 40px;
      position: relative; overflow: hidden; z-index: 1;
    }
    .header-deco {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.06'%3E%3Ccircle cx='30' cy='30' r='8'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }
    .mascot { font-size: 3.2rem; display: block; margin-bottom: 8px; animation: bob 2.5s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    header h1 {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 2.3rem; font-weight: 800;
      text-shadow: 0 3px 14px rgba(100,40,160,0.3);
      letter-spacing: 1px;
    }
    header .sub { font-size: 0.95rem; margin-top: 6px; opacity: 0.88; }
    .header-badges { margin-top: 14px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .hbadge {
      background: rgba(255,255,255,0.22); border-radius: 20px;
      padding: 5px 16px; font-size: 0.82rem; font-weight: 800;
      letter-spacing: 0.5px; backdrop-filter: blur(4px);
      border: 1.5px solid rgba(255,255,255,0.3);
    }
    .back-link {
      display: inline-block; color: white; text-decoration: none;
      background: rgba(255,255,255,0.22); border-radius: 20px;
      padding: 5px 16px; font-size: 0.82rem; font-weight: 800;
      border: 1.5px solid rgba(255,255,255,0.3); transition: background 0.2s;
    }
    .back-link:hover { background: rgba(255,255,255,0.38); }

    /* ── Main ── */
    main { max-width: 800px; margin: 32px auto; padding: 0 18px 100px; position: relative; z-index: 1; }

    /* ── Progress ── */
    .progress-wrap {
      background: rgba(255,255,255,0.85); border-radius: 20px; padding: 16px 22px;
      box-shadow: 0 4px 18px var(--shadow); margin-bottom: 22px;
      border: 2px solid var(--pink-lt); backdrop-filter: blur(6px);
    }
    .progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .q-counter { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 0.9rem; color: var(--text-sm); }
    .score-pill {
      background: linear-gradient(135deg, var(--pink), var(--lav));
      color: white; border-radius: 99px; padding: 4px 16px;
      font-size: 0.88rem; font-weight: 800;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      box-shadow: 0 3px 10px rgba(180,100,220,0.3);
    }
    .stars-row { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
    .star-dot {
      width: 22px; height: 22px; border-radius: 50%; font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center;
      background: #EDE4FF; transition: all 0.3s;
    }
    .star-dot.correct { background: var(--mint); }
    .star-dot.wrong   { background: var(--pink-lt); }
    .bar-track { height: 12px; background: #EDE4FF; border-radius: 99px; overflow: hidden; }
    .bar-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, #FF8FAB, #C09FFF, #91D8FF);
      background-size: 200% 100%;
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
      animation: shimmer 2s linear infinite;
    }
    @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

    /* ── Grammar panel ── */
    .grammar-panel {
      background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(240,228,255,0.88));
      border-radius: 22px; padding: 22px 26px; margin-bottom: 16px;
      border: 2px solid var(--lav-md);
      box-shadow: 0 6px 24px var(--shadow); backdrop-filter: blur(6px);
      position: relative; overflow: hidden;
    }
    .grammar-panel::after {
      content: '✨'; position: absolute; right: 18px; top: 16px; font-size: 1.4rem; opacity: 0.4;
    }
    .gp-title {
      font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 1.35rem; font-weight: 800;
      background: linear-gradient(90deg, #C040C0, #6030C0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 2px;
    }
    .gp-romaji { font-size: 0.82rem; color: var(--text-sm); font-style: italic; margin-bottom: 12px; }
    .explain-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .eb { flex: 1; min-width: 180px; border-radius: 14px; padding: 10px 14px; font-size: 0.87rem; line-height: 1.6; }
    .eb.en { background: var(--lav-lt); border: 1.5px solid var(--lav-md); }
    .eb.jp { background: var(--pink-bg); border: 1.5px solid var(--pink-lt); }
    .eb-label { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; }
    .eb.en .eb-label { color: #8060D0; }
    .eb.jp .eb-label { color: var(--pink); }
    .example-box {
      background: var(--yel-lt); border: 1.5px solid #FFE090; border-radius: 14px;
      padding: 12px 16px; font-size: 0.87rem;
      display: flex; flex-direction: column; gap: 4px;
    }
    .ex-top { display: flex; align-items: center; gap: 8px; }
    .speak-btn {
      background: linear-gradient(135deg, var(--pink), var(--lav));
      border: none; border-radius: 99px; width: 32px; height: 32px;
      font-size: 0.85rem; cursor: pointer; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(180,100,220,0.3);
      transition: all 0.18s cubic-bezier(.34,1.56,.64,1);
      display: flex; align-items: center; justify-content: center;
    }
    .speak-btn:hover { transform: scale(1.15); box-shadow: 0 4px 12px rgba(180,100,220,0.45); }
    .speak-btn.playing { animation: pulse 0.6s ease infinite alternate; background: linear-gradient(135deg, var(--mint), var(--sky)); }
    @keyframes pulse { from{transform:scale(1)} to{transform:scale(1.2)} }
    .ex-jp   { font-weight: 800; font-family: 'M PLUS Rounded 1c', sans-serif; }
    .ex-kana { color: #C060C0; font-size: 0.84rem; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; }
    .ex-rom  { color: var(--text-sm); font-style: italic; font-size: 0.81rem; }
    .ex-en   { color: #A06000; font-size: 0.84rem; }

    /* ── Question card ── */
    .q-card {
      background: rgba(255,255,255,0.92); border-radius: 24px; padding: 28px 28px 24px;
      border: 2.5px solid var(--pink-lt);
      box-shadow: 0 8px 32px var(--shadow); backdrop-filter: blur(8px);
      position: relative; overflow: hidden;
      display: none;
    }
    .q-card.active { display: block; animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1); }
    @keyframes popIn { from{opacity:0;transform:scale(0.93) translateY(16px)} to{opacity:1;transform:scale(1) translateY(0)} }
    .q-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
      background: linear-gradient(90deg, var(--pink), var(--lav), var(--sky));
    }
    .q-card.shake { animation: shake 0.4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
    .q-card.pop { animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1); }

    .q-num { font-size: 0.72rem; font-weight: 800; color: var(--text-sm); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
    .q-text { font-size: 1.05rem; font-weight: 700; line-height: 1.9; margin-bottom: 22px; white-space: pre-line; }

    /* ── Choices ── */
    .choices { display: flex; flex-direction: column; gap: 10px; }
    .choice-btn {
      background: linear-gradient(135deg, #FAF0FF, #F5EBFF);
      border: 2px solid var(--lav-md); border-radius: 16px;
      padding: 13px 20px; font-size: 0.96rem;
      font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
      font-weight: 700; color: var(--text);
      cursor: pointer; text-align: left;
      transition: all 0.18s cubic-bezier(.34,1.56,.64,1);
      position: relative; overflow: hidden;
    }
    .choice-btn::before { content: ''; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; border-radius: 50%; background: var(--lav-md); transition: background 0.2s; }
    .choice-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #EDE4FF, #E0D0FF);
      border-color: var(--lav); transform: translateY(-2px) scale(1.01);
      box-shadow: 0 4px 14px rgba(160,120,240,0.25);
      padding-left: 28px;
    }
    .choice-btn.correct { background: linear-gradient(135deg, #D0F5E8, #C0F0E0); border-color: var(--mint); color: #1A6A50; }
    .choice-btn.correct::before { background: var(--mint); }
    .choice-btn.wrong   { background: linear-gradient(135deg, #FFE0EC, #FFD0E0); border-color: var(--pink); color: #A02040; }
    .choice-btn.wrong::before { background: var(--pink); }
    .choice-btn:disabled { cursor: default; transform: none !important; }

    /* ── Fill input ── */
    .fill-wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .fill-input {
      border: 2.5px solid var(--lav-md); border-radius: 14px;
      padding: 10px 18px; font-size: 1rem;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #FAF5FF; color: var(--text);
      min-width: 160px; max-width: 240px;
      transition: all 0.2s; box-shadow: inset 0 2px 6px rgba(180,140,220,0.1);
    }
    .fill-input:focus { outline: none; border-color: var(--lav); background: white; box-shadow: 0 0 0 4px rgba(192,159,255,0.18); }
    .fill-input.correct { border-color: var(--mint); background: #D0F5E8; color: #1A6A50; }
    .fill-input.wrong   { border-color: var(--pink); background: #FFE0EC; color: #A02040; }

    .submit-btn {
      background: linear-gradient(135deg, #FF8FAB, #C09FFF);
      color: white; border: none; border-radius: 14px; padding: 11px 26px;
      font-size: 0.95rem; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800;
      cursor: pointer; box-shadow: 0 4px 16px rgba(180,100,220,0.35);
      transition: all 0.18s cubic-bezier(.34,1.56,.64,1);
    }
    .submit-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 6px 20px rgba(180,100,220,0.45); }
    .submit-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

    /* ── Feedback ── */
    .feedback { margin-top: 16px; padding: 14px 18px; border-radius: 16px; font-size: 0.92rem; display: none; line-height: 1.7; }
    .feedback.correct { background: linear-gradient(135deg, #D0F5E8, #C8F0E0); border: 2px solid var(--mint); color: #1A6A50; }
    .feedback.wrong   { background: linear-gradient(135deg, #FFE0EC, #FFD4E4); border: 2px solid var(--pink); color: #A02040; }
    .feedback.show    { display: block; animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1); }
    .feedback-jp { margin-top: 6px; opacity: 0.85; }

    /* ── Next button ── */
    .next-btn {
      display: none; margin-top: 18px;
      background: linear-gradient(135deg, #B07FFF, #7FBFFF);
      color: white; border: none; border-radius: 16px; padding: 13px 36px;
      font-size: 1rem; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800;
      cursor: pointer; box-shadow: 0 5px 18px rgba(120,100,240,0.35);
      transition: all 0.18s cubic-bezier(.34,1.56,.64,1);
      letter-spacing: 0.5px;
    }
    .next-btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 8px 24px rgba(120,100,240,0.45); }
    .next-btn.show { display: inline-block; animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1); }

    /* ── Sparkles ── */
    .sparkle {
      position: fixed; pointer-events: none; z-index: 999;
      font-size: 1.2rem; animation: sparkleUp 0.8s ease-out forwards;
    }
    @keyframes sparkleUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-80px) scale(0.4)} }

    /* ── Result ── */
    #result { display: none; }
    #result.show { display: block; animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1); }
    .result-card {
      background: rgba(255,255,255,0.95); border-radius: 30px; padding: 52px 32px;
      box-shadow: 0 10px 40px var(--shadow); border: 3px solid var(--pink-lt);
      text-align: center; position: relative; overflow: hidden;
    }
    .result-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
      background: linear-gradient(90deg, var(--pink), var(--lav), var(--sky), var(--mint));
    }
    .result-mascot { font-size: 5rem; margin-bottom: 12px; display: block; animation: bounce 1s ease infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0) scale(1)} 40%{transform:translateY(-18px) scale(1.08)} 60%{transform:translateY(-10px) scale(1.04)} }
    .result-title {
      font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 1.9rem; font-weight: 800;
      background: linear-gradient(90deg, #C040C0, #6030C0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .result-score {
      font-size: 4rem; font-weight: 800; color: #A030B0;
      font-family: 'M PLUS Rounded 1c', sans-serif; margin: 14px 0;
      text-shadow: 0 4px 16px rgba(180,60,200,0.25);
    }
    .result-msg { color: var(--text-sm); font-size: 1rem; margin-bottom: 30px; line-height: 1.9; }
    .result-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 28px; flex-wrap: wrap; }
    .result-dot { font-size: 1.1rem; }
    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .retry-btn {
      background: linear-gradient(135deg, var(--pink), var(--lav));
      color: white; border: none; border-radius: 18px; padding: 15px 38px;
      font-size: 1.05rem; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800;
      cursor: pointer; box-shadow: 0 5px 20px rgba(180,100,220,0.4);
      transition: all 0.18s cubic-bezier(.34,1.56,.64,1);
    }
    .retry-btn:hover { transform: translateY(-3px) scale(1.04); }
    .review-btn {
      display: inline-block; background: linear-gradient(135deg, var(--mint), var(--sky));
      color: white; border-radius: 18px; padding: 15px 38px;
      font-size: 1.05rem; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800;
      text-decoration: none; box-shadow: 0 5px 20px rgba(80,200,180,0.35);
      transition: all 0.18s cubic-bezier(.34,1.56,.64,1);
    }
    .review-btn:hover { transform: translateY(-3px) scale(1.04); }

    /* ── Confetti ── */
    .confetti-piece {
      position: fixed; z-index: 9999; pointer-events: none;
      width: 10px; height: 10px; border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall { 0%{opacity:1;transform:translateY(0) rotate(0deg)} 100%{opacity:0;transform:translateY(100vh) rotate(720deg)} }
  </style>
</head>
<body>

<!-- Floating sakura petals -->
<div id="petals"></div>

<header>
  <div class="header-deco"></div>
  <span class="mascot">🌸</span>
  <h1>JLPT N3 Grammar Quiz</h1>
  <p class="sub">日本語能力試験 N3 文法クイズ · 全50問</p>
  <div class="header-badges">
    <span class="hbadge">🎯 JLPT N3</span>
    <span class="hbadge">🇯🇵 Japanese</span>
    <a href="index.html" class="back-link">← Grammar Guide</a>
  </div>
</header>

<main>
  <div class="progress-wrap">
    <div class="progress-top">
      <span class="q-counter" id="q-counter">Question 1 / 20</span>
      <span class="score-pill" id="score-pill">⭐ 0 pt</span>
    </div>
    <div class="stars-row" id="stars-row"></div>
    <div class="bar-track"><div class="bar-fill" id="progress-fill" style="width:5%"></div></div>
  </div>

  <div id="quiz-area"></div>

  <div id="result">
    <div class="result-card">
      <span class="result-mascot" id="result-mascot">🌸</span>
      <div class="result-title">Quiz Complete! クイズ完了！</div>
      <div class="result-score" id="result-score">0 / 20</div>
      <div class="result-dots" id="result-dots"></div>
      <div class="result-msg" id="result-msg"></div>
      <div class="btn-row">
        <button class="retry-btn" onclick="startQuiz()">🔄 Try Again · もう一度</button>
        <a href="index.html" class="review-btn">📖 Grammar Guide</a>
      </div>
    </div>
  </div>
</main>

<script>
/* ── Sakura petals ── */
const petalSymbols = ['🌸','🌺','✿','❀','🌷','⭐','✨','💫'];
const petalContainer = document.getElementById('petals');
for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = petalSymbols[Math.floor(Math.random() * petalSymbols.length)];
  p.style.left = Math.random() * 100 + '%';
  p.style.fontSize = (0.9 + Math.random() * 1.2) + 'rem';
  p.style.opacity = (0.2 + Math.random() * 0.4);
  p.style.animationDuration = (7 + Math.random() * 12) + 's';
  p.style.animationDelay = (Math.random() * 14) + 's';
  petalContainer.appendChild(p);
}

/* ── Confetti ── */
function launchConfetti() {
  const colors = ['#FF8FAB','#C09FFF','#91D8FF','#6EE7C0','#FFE066','#FFBF96'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-10px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (6 + Math.random() * 8) + 'px';
    c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

/* ── Sparkle effect ── */
function spawnSparkles(x, y) {
  const sparks = ['⭐','✨','💫','🌟','💕','🎉'];
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = sparks[Math.floor(Math.random() * sparks.length)];
    s.style.left = (x - 20 + Math.random() * 60) + 'px';
    s.style.top  = (y - 20 + Math.random() * 30) + 'px';
    s.style.animationDelay = (Math.random() * 0.3) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

/* ── Text-to-Speech (native Japanese voice) ── */
let jpVoice = null;
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  const preferred = ['Kyoko','O-ren','Otoya','Haruka','Nanami','Microsoft Haruka','Microsoft Ayumi','Google 日本語','Google Japanese'];
  for (const name of preferred) {
    const v = voices.find(v => v.name.includes(name));
    if (v) { jpVoice = v; break; }
  }
  if (!jpVoice) jpVoice = voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja') || null;
}
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text, btn) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.85;

    choices:["て-form (あけて)","dictionary form (あける)","た-form (あけた)","ない-form (あけない)"],
    answer:"た-form (あけた)",
    fb_en:"✅ た-form + まま = 'leaving it in the state of having done ~'.",
    fb_jp:"どうしのたけい（〜た）＋まま。「あけた」＋まま＝「あけたまま」（あけたじょうたいのまま）。"
  },
  {
    grammar:"〜まま", romaji:"~mama",
    en_explain:"立つ (to stand) → た-form: 立った + まま = 立ったまま (while standing / remaining standing).",
    jp_kana:"「たつ」のたけい：「たった」→「たった」＋まま＝「たったまま」（たってい　るじょうたいで）。",
    example_jp:"立ったまま、話した。", example_kana:"たったまま、はなした。",
    example_rom:"Tatta mama, hanashita.", example_en:"I talked while standing up.",
    type:"fill", q:"「立つ」をままのかたちにして、ぶんをかんせいさせてください:\n「___ 、話した。(I talked while standing.)」\n(た-form of 立つ + まま. Write in hiragana)",
    answer:"たったまま",
    fb_en:"✅ 立つ → た-form 立った + まま = 立ったまま = たったまま.",
    fb_jp:"「たつ」のたけいは「たった」→「たった」＋まま＝「たったまま」。"
  },
  {
    grammar:"〜まま", romaji:"~mama",
    en_explain:"Verb た-form + まま. 電気をつける (to turn on lights) → つけた + まま.",
    jp_kana:"「でんきをつけた」＋まま＝「つけたまま」（けさないで）。",
    example_jp:"テレビをつけたまま、寝た。", example_kana:"テレビをつけたまま、ねた。",
    example_rom:"Terebi wo tsuketa mama, neta.", example_en:"I fell asleep with the TV on.",
    type:"fill", q:"Complete:\n「電気をつけた ___ 、寝てしまった。(I fell asleep with the lights on.)」",
    answer:"まま",
    fb_en:"✅ つけた (past) + まま = 'leaving the lights on.' The lights were not turned off.",
    fb_jp:"「つけた」（たけい）＋まま＝「つけたまま」（けさないで　そのままにした）。"
  },
  {
    grammar:"〜まま", romaji:"~mama",
    en_explain:"履く (はく, to put on shoes) → た-form: 履いた + まま = 履いたまま.",
    jp_kana:"「はく」のたけい：「はいた」→「はいた」＋まま＝「はいたまま」（ぬがないで）。",
    example_jp:"子どもは靴を履いたまま、家に入った。", example_kana:"こどもはくつをはいたまま、いえにはいった。",
    example_rom:"Kodomo wa kutsu wo haita mama, ie ni haitta.", example_en:"The child entered the house with shoes on.",
    type:"fill", q:"「履く」をままのかたちにしてください:\n「子どもは靴を ___ 、家に入った。」\n(た-form of 履く + まま. Write in hiragana)",
    answer:"はいたまま",
    fb_en:"✅ 履く → た-form 履いた + まま = 履いたまま = はいたまま.",
    fb_jp:"「はく」のたけいは「はいた」→「はいた」＋まま＝「はいたまま」。くつをぬがないで　そのまま。"
  }
];

/* ── State ── */
let current = 0, score = 0, answered = false, shuffled = [];
let dotResults = [];

function shuffle(arr) {
  for (let i = arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function startQuiz() {
  current = 0; score = 0; dotResults = [];
  shuffled = shuffle([...questions]);
  document.getElementById('result').classList.remove('show');
  document.getElementById('quiz-area').style.display = 'block';
  buildStars();
  renderQuestion();
  updateProgress();
}

function buildStars() {
  const row = document.getElementById('stars-row');
  row.innerHTML = '';
  shuffled.forEach((_,i) => {
    const d = document.createElement('div');
    d.className = 'star-dot';
    d.id = 'dot-' + i;
    d.textContent = '○';
    row.appendChild(d);
  });
}

function updateProgress() {
  const total = shuffled.length;
  document.getElementById('progress-fill').style.width = Math.max(5, (current/total)*100) + '%';
  document.getElementById('q-counter').textContent = `Question ${current+1} / ${total}`;
  document.getElementById('score-pill').textContent = `⭐ ${score} pt`;
}

function esc(s){ return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function renderQuestion() {
  answered = false;
  const q = shuffled[current];
  const area = document.getElementById('quiz-area');

  const panel = `<div class="grammar-panel">
    <div class="gp-title">${q.grammar}</div>
    <div class="gp-romaji">${q.romaji}</div>
    <div class="explain-row">
      <div class="eb en"><div class="eb-label">🇬🇧 English</div>${q.en_explain}</div>
      <div class="eb jp"><div class="eb-label">🇯🇵 にほんご（ひらがな・カタカナ）</div>${q.jp_kana}</div>
    </div>
    <div class="example-box">
      <div class="ex-top">
        <button class="speak-btn" id="speak-btn" onclick="speak('${esc(q.example_jp)}',this)" title="きいてみよう！">🔊</button>
        <div>
          <div class="ex-jp">${q.example_jp}</div>
          <div class="ex-kana">📖 ${q.example_kana}</div>
        </div>
      </div>
      <div class="ex-rom">${q.example_rom}</div>
      <div class="ex-en">${q.example_en}</div>
    </div>
  </div>`;

  let card = '';
  if (q.type === 'mc') {
    const sc = shuffle([...q.choices]);
    card = `<div class="q-card active">
      <div class="q-num">✏️ Question ${current+1} · Multiple Choice</div>
      <div class="q-text">${q.q}</div>
      <div class="choices">
        ${sc.map(c=>`<button class="choice-btn" onclick="checkMC(this,'${esc(c)}','${esc(q.answer)}','${esc(q.fb_en)}','${esc(q.fb_jp)}')">${c}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQ()">次へ → Next 🌸</button>
    </div>`;
  } else {
    card = `<div class="q-card active">
      <div class="q-num">✏️ Question ${current+1} · Fill in the Blank</div>
      <div class="q-text">${q.q}</div>
      <div class="fill-wrap">
        <input class="fill-input" id="fill-input" type="text" placeholder="答えを入力…" autocomplete="off"
          onkeydown="if(event.key==='Enter')checkFill('${esc(q.answer)}','${esc(q.fb_en)}','${esc(q.fb_jp)}')">
        <button class="submit-btn" id="submit-btn"
          onclick="checkFill('${esc(q.answer)}','${esc(q.fb_en)}','${esc(q.fb_jp)}')">Check ✓</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQ()">次へ → Next 🌸</button>
    </div>`;
  }

  area.innerHTML = panel + card;
  if (q.type === 'fill') setTimeout(() => document.getElementById('fill-input').focus(), 100);
}

function showFeedback(correct, fb_en, fb_jp, triggerEl) {
  const fb = document.getElementById('feedback');
  fb.innerHTML = `${fb_en}<div class="feedback-jp">${fb_jp}</div>`;
  fb.className = 'feedback ' + (correct ? 'correct' : 'wrong') + ' show';
  document.getElementById('next-btn').classList.add('show');
  document.getElementById('score-pill').textContent = `⭐ ${score} pt`;

  const dot = document.getElementById('dot-' + current);
  if (dot) { dot.classList.add(correct ? 'correct' : 'wrong'); dot.textContent = correct ? '⭐' : '✕'; }
  dotResults[current] = correct;

  if (correct && triggerEl) {
    const rect = triggerEl.getBoundingClientRect();
    spawnSparkles(rect.left + rect.width/2, rect.top);
  }
  if (!correct) {
    document.querySelector('.q-card').classList.add('shake');
    setTimeout(() => document.querySelector('.q-card')?.classList.remove('shake'), 450);
  }
}

function checkMC(btn, chosen, answer, fb_en, fb_jp) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === answer) b.classList.add('correct');
  });
  const correct = chosen === answer;
  btn.classList.add(correct ? 'correct' : 'wrong');
  if (correct) score++;
  showFeedback(correct, fb_en, fb_jp, btn);
}

function checkFill(answer, fb_en, fb_jp) {
  if (answered) return;
  const input = document.getElementById('fill-input');
  const val = input.value.trim();
  if (!val) return;
  answered = true;
  input.disabled = true;
  document.getElementById('submit-btn').disabled = true;
  const correct = val === answer;
  input.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    const hint = document.createElement('span');
    hint.style.cssText = 'color:#1A7A55;font-weight:800;font-size:1rem;margin-left:8px;font-family:"M PLUS Rounded 1c",sans-serif;';
    hint.textContent = '→ ' + answer;
    input.parentNode.appendChild(hint);
  }
  if (correct) score++;
  showFeedback(correct, fb_en, fb_jp, input);
}

function nextQ() {
  current++;
  if (current >= shuffled.length) showResult();
  else { updateProgress(); renderQuestion(); }
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const r = document.getElementById('result');
  r.classList.add('show');
  const pct = score / shuffled.length;
  let mascot, msg;
  if (pct >= 0.9)      { mascot='🏆'; msg='Amazing! You are an N3 Grammar Master!\nN3文法マスターです！本当にすごい！🌟'; launchConfetti(); }
  else if (pct >= 0.7) { mascot='🌸'; msg='Great job! Almost a master!\nよくできました！もう少しで完璧です！✨'; launchConfetti(); }
  else if (pct >= 0.5) { mascot='😊'; msg='Good effort! Keep going!\nよく頑張りました！もっと練習しましょう！💪'; }
  else                  { mascot='📖'; msg='Review the grammar and try again!\nもう一度文法を復習してみましょう！🌱'; }
  document.getElementById('result-mascot').textContent = mascot;
  document.getElementById('result-score').textContent = `${score} / ${shuffled.length}`;
  document.getElementById('result-msg').textContent = msg;

  const dots = document.getElementById('result-dots');
  dots.innerHTML = dotResults.map(d => `<span class="result-dot">${d ? '⭐' : '💔'}</span>`).join('');

  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('q-counter').textContent = 'Complete! 完了！🎉';
}

startQuiz();
</script>
</body>
</html>
